        : (kind === "1" ? "部首の名" : "カタカナ語");
  showOv("good", `<h2>BONUS</h2><div class="sub">${bsub}</div>
    <p>40秒で3問。突破すると<b style="color:var(--midori)">問題入替</b>を1回もらえます。<br>まちがえても人数は減りません。</p>`);
  await sleep(2200); hideOv();
  if (G.cancelled) return;
  Audio_.bgmStart("bonus");

  const pool = kind === "1" ? "b1" : "b2";
  let count = 0, failed = false;
  startTimer(40);
  while (count < 3) {
    if (G.cancelled) return;
    // 解説の表示中に時間切れが来ていた場合もここで拾う
    if (!G.timing || G.pending === "timeout") { G.pending = null; failed = true; break; }
    const bonusLead = isEnglish()
      ? (answersInEnglish() ? "英単語で こたえよ" : "日本語訳を ひらがなで")
      : isRadical()
        ? "部首の名を こたえよ"
        : (kind === "1" ? "部首の名を こたえよ" : "カタカナ語で こたえよ");
    renderQ(pick(pool), kind === "2", bonusLead);
    if ((isMath() || isEnglish() || isRadical()) ? CFG.hint : kind === "2") showHint(); else hideHint();
    $("lvName").textContent = `BONUS ${count + 1} / 3`;
    G.state = "answer"; renderSlots();
    const r = await awaitAnswer();
    if (r === "quit" || G.cancelled) return;
    if (r === "timeout") { failed = true; break; }
    count++;
    if (count >= 3) stopTimer();
    showReveal(answerDisplay(), true);
    await sleep(900); hideReveal();
  }
  if (failed) {
    stopTimer(); hideReveal();
    Audio_.sfx.bonusFail(); flash("beam");
    Audio_.bgmStop(0.3);
    showOv("bad", `<h2>MISS</h2><div class="sub">突破ならず</div><div class="big">${answerDisplay()}</div>`);
    await sleep(2600); hideOv();
  }
  if (count >= 3) {
    G.swaps++;
    Audio_.bgmStop(0.3); Audio_.sfx.bonusClear(); flash("hit");
    showOv("good", `<h2>CLEAR</h2><div class="sub">問題入替 ＋1</div>
      <p>答えにくい問題を、いつでも1回だけ引き直せます。</p>`);
    await sleep(2600); hideOv();
  }
  stopTimer(); hideHint();
  G.pending = null; G.bonusMode = null; G.kata = false;
  renderHud();
}

/* ---------- 交代・結末 ---------- */
async function pilotChange() {
  const crew = [...Array(CFG.lives)].map((_, i) =>
    `<i class="${i >= G.lives ? "lost" : (i === G.lives - 1 ? "now" : "")}"></i>`).join("");
  Audio_.sfx.relay();
  showOv("", `<h2>RELAY</h2><div class="sub">読み手 交代</div>
    <div class="crewlarge">${crew}</div>
    <p>残り <b style="color:var(--kin);font-size:20px">${G.lives}</b> 人<br>次の読み手が席につきました</p>
    <div class="acts"><span class="btn" style="pointer-events:none">クリック か Space で再開</span></div>`);
  await waitPress();
  hideOv();
}

async function levelBanner(level) {
  Art.setLevel(level);
  if (G.stage === 6) Art.setStage(6, level, G.rooms[lvIndex(level)]);
  Audio_.sfx.levelUp();
  Audio_.bgmStop(0.3);
  showOv("gold", `<h2>${LV_LABEL[level]}</h2><div class="sub">${STAGES[G.stage].jp} ${level === "final" ? "最深部" : "第" + (lvIndex(level) + 1) + "層"} ／ ${routeName(G.stage)}</div>`);
  await sleep(1600); hideOv();
  Audio_.bgmStart(G.stage === 7 ? "final" : level);
}

async function gameCleared() {
  stopTimer(); Art.vanish(); Audio_.bgmStop(0.5);
  await sleep(500); Audio_.sfx.cleared(); flash("hit");
  showOv("good", `<h2>ALL CLEAR</h2><div class="sub">${STAGES[G.stage].jp} 突破</div>
    <p>全 ${CFG.N} 問 正解　／　読み手 ${G.lives} 人 生還</p>
    <div class="acts">
      <button class="btn primary" id="againBtn">もう一度</button>
      <button class="btn" id="backBtn">設定へ戻る</button>
    </div>`);
  $("againBtn").onclick = () => { hideOv(); start(); };
  $("backBtn").onclick = () => { hideOv(); toSetup(); };
}
async function gameOver() {
  stopTimer(); Audio_.bgmStop(0.4);
  Art.vanish();
  await sleep(900); Audio_.sfx.gameover();
  showOv("bad", `<h2>GAME OVER</h2><div class="sub">読み手 全滅</div>
    <p>${CFG.N} 問中 ${G.correct} 問 正解</p>
    <div class="acts">
      <button class="btn primary" id="againBtn">もう一度</button>
      <button class="btn" id="backBtn">設定へ戻る</button>
    </div>`);
  $("againBtn").onclick = () => { hideOv(); start(); };
  $("backBtn").onclick = () => { hideOv(); toSetup(); };
}

/* ---------- 本編ループ ---------- */
async function mainLoop() {
  const b = BOUNDS[CFG.N];
  Audio_.bgmStart(G.stage === 7 ? "final" : "l1");
  while (true) {
    if (G.cancelled) return;
    const before = G.level;
    const r = await runQuestion();
    if (r === "quit" || G.cancelled) return;

    if (r === "correct") {
      G.correct++;
      G.combo = Math.max(G.combo, 0) + 1;
      G.hintOn = false; hideHint();
      showReveal(answerDisplay(), true);
      Art.vanish();
      renderHud();
      await sleep(1600);
      if (G.cancelled) return;
      hideReveal();
      $("bonusTag").hidden = true;

      if (G.tagKind) { await runBonus(G.tagKind); G.tagKind = null; }
      if (G.cancelled) return;

      if (G.correct >= b[3]) { await gameCleared(); return; }
      const next = levelOf(G.correct);
      if (next !== before) await levelBanner(next);
      else await sleep(200);

    } else {
      G.lives--;
      G.combo = Math.min(G.combo, 0) - 1;
      Audio_.sfx.beam(); flash("beam"); Art.hurt();
      renderHud();
      showReveal(answerDisplay());
      Audio_.bgmDuck(true);
      await sleep(2400);
      if (G.cancelled) return;
      hideReveal(); Art.vanish();
      Audio_.bgmDuck(false);

      if (G.lives <= 0) { await gameOver(); return; }
      if (G.combo === -2 && CFG.hint) { G.hintOn = true; }
      await pilotChange();
      if (G.cancelled) return;
    }
  }
}

/* ---------- 起動 ---------- */
function toSetup() {
  stopTimer(); Audio_.bgmStop(0.3); Art.vanish();
  G.state = "idle"; G.paused = false;
  $("pauseScreen").classList.remove("on"); $("quitConfirm").classList.remove("on"); hideOv();
  $("setup").classList.add("on"); $("play").classList.remove("on"); $("launch").classList.remove("on");
  buildSetup();
}

async function start() {
  G.cancelled = false; G.paused = false; G.pauseWasTiming = false; G.pauseElapsed = 0;
  $("pauseScreen").classList.remove("on"); $("quitConfirm").classList.remove("on");
  Audio_.setVolume(CFG.volume);
  Audio_.resume();
  Audio_.setBgmEnabled(!!CFG.bgm);
  Art.setFx(motionOK());

  G.stage = CFG.stage === "?" ? 1 + Math.floor(Math.random() * 7) : Number(CFG.stage);
  G.level = "l1"; G.correct = 0; G.combo = 0; G.lives = CFG.lives; G.swaps = 0;
  G.used = {}; G.hintOn = false; G.tagKind = null; G.bonusMode = null; G.kata = false;
  G.routePlan = buildRoutePlan(G.stage, CFG.N);
  G.rooms = [0, 1, 2].sort(() => Math.random() - .5).concat([0, 1, 2]);

  Art.setStage(G.stage, "l1", G.rooms[0]);
  Art.vanish();

  $("setup").classList.remove("on");
  $("play").classList.remove("on");
  $("launch").classList.add("on");

  const cd = $("cdText");
  for (const n of ["3", "2", "1"]) {
    cd.className = "cd"; cd.textContent = n; void cd.offsetWidth; cd.classList.add("pulse");
    Audio_.sfx.tick(); Audio_.sfx.ui();
    await sleep(820);
  }
  cd.className = "cd go"; cd.textContent = "発　進"; void cd.offsetWidth; cd.classList.add("pulse");
  Audio_.sfx.beam(); Art.warp(1); flash("fire");
  await sleep(900);

  $("launch").classList.remove("on");
  $("play").classList.add("on");
  buildKeyboard(); renderSlots(); renderHud();
  mainLoop();
}

/* ---------- 入力イベント ---------- */
async function toggleFullscreen() {
  Audio_.sfx.ui();
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if (document.fullscreenEnabled === false) {
      /* 埋め込み表示（GAS のウェブアプリなど）では全画面が許されていないので、先に案内だけ出す */
      throw new Error("Fullscreen is not allowed here");
    } else if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    } else {
      throw new Error("Fullscreen API is unavailable");
    }
  } catch (_) {
    alert("この表示環境では全画面APIが制限されています。WindowsはF11キー、MacはControl＋Command＋Fをお使いください。");
  }
}

$('fullscreenBtn').onclick = toggleFullscreen;
$("pauseBtn").onclick = pauseGame;
$("resumeBtn").onclick = resumeGame;
$("quitBtn").onclick = requestQuit;
$("pauseQuitBtn").onclick = requestQuit;
$("cancelQuitBtn").onclick = cancelQuit;
$("confirmQuitBtn").onclick = confirmQuit;
$("pauseVolumeSlider").oninput = e => setGameVolume(e.target.value, false);
$("pauseVolumeSlider").onchange = e => setGameVolume(e.target.value, true);
$("fireBtn").onclick = fire;
$("delBtn").onclick = backspace;
$("clearBtn").onclick = clearAnswer;
$("hintBtn").onclick = requestHint;
$("resetBtn").onclick = resetSettings;
$("swapBtn").onclick = swap;
$("goBtn").onclick = () => start();

window.addEventListener("keydown", e => {
  if ($("quitConfirm").classList.contains("on")) {
    if (e.code === "Escape") { e.preventDefault(); cancelQuit(); }
    return;
  }
  if (G.paused) {
    if (e.code === "Escape" || e.code === "Space") { e.preventDefault(); resumeGame(); }
    return;
  }
  if ($("edit").classList.contains("on")) return;
  if ($("ov").classList.contains("on")) return;
  if (!$("play").classList.contains("on")) return;
  if (e.code === "Escape") { e.preventDefault(); pauseGame(); return; }
  if (e.code === "Backspace") { e.preventDefault(); backspace(); return; }
  if (e.code === "Delete") { e.preventDefault(); clearAnswer(); return; }
  if (e.code === "Enter" || e.code === "NumpadEnter") {
    e.preventDefault();
    if (CFG.input === 1 && IN.romaji) {
      const [k, rest] = romajiConsume(IN.romaji, true);
      IN.romaji = rest;
      for (const ch of k) if (IN.kana.length < 15) IN.kana.push(G.kata ? toKata(ch) : ch);
      renderSlots();
    }
    fire(); return;
  }
  if (isMath()) {
    if (G.state === "answer" && !G.judging && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const k = e.key, low = k.toLowerCase();
      let tok = null;
      if (/^[0-9]$/.test(k)) tok = k;
      else if ("+-/^.".includes(k)) tok = k;
      else if ("xyab".includes(low)) tok = low;
      else if (low === "r") tok = "√";
      if (tok) { e.preventDefault(); pressMath(tok); }
      else if (e.code === "ArrowUp") { e.preventDefault(); mathMoveCursor("num"); }
      else if (e.code === "ArrowDown") { e.preventDefault(); mathMoveCursor("den"); }
      else if (e.code === "ArrowRight") { e.preventDefault(); mathMoveCursor(null); }
    }
    return;
  }
  if (answersInEnglish()) {
    if (CFG.input === 1 && G.state === "answer" && !G.judging && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const ch = e.key.toLowerCase();
      if (/^[a-z]$/.test(ch)) { e.preventDefault(); pressEnglish(ch); }
    }
    return;
  }
  if (CFG.input === 1 && G.state === "answer" && !G.judging && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const ch = e.key.toLowerCase();
    if (/^[a-z]$/.test(ch)) { e.preventDefault(); pressRomaji(ch); }
    else if (ch === "-") { e.preventDefault(); pressRomaji("-"); }
  }
});

/* ---------- 問題編集 ---------- */
let editSrc = JSON.parse(JSON.stringify(KANJI_RAW));
$("editBtn").onclick = () => { $("editArea").value = JSON.stringify(editSrc, null, 1); $("edit").classList.add("on"); };
$("editClose").onclick = () => $("edit").classList.remove("on");
$("editReset").onclick = () => { $("editArea").value = JSON.stringify(KANJI_RAW, null, 1); $("editMsg").textContent = "増量済みの初期問題を読み込みました。「この内容で使う」を押してください。"; };
$("editApply").onclick = () => {
  try {
    const o = JSON.parse($("editArea").value);
    for (const k of ["l1", "l2", "l3", "final", "b1", "b2"]) {
      if (!Array.isArray(o[k]) || !o[k].length) throw new Error(k + " が空です");
      const need = k === "b1" ? 3 : 2;
      for (const row of o[k]) if (!Array.isArray(row) || row.length < need) throw new Error(k + " の書式が違います");
    }
    QSET = normalizeQ(o); editSrc = o; PICK_BAGS.clear();
    $("editMsg").textContent = "反映しました。";
    Audio_.sfx.swap();
  } catch (err) { $("editMsg").textContent = "読み込めません：" + err.message; }
};
$("editDl").onclick = () => {
  const blob = new Blob([$("editArea").value], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "five-readers-questions.json"; a.click();
  URL.revokeObjectURL(a.href);
};
$("editUp").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("editArea").value = await f.text();
  $("editMsg").textContent = "読み込みました。「この内容で使う」を押してください。";
  e.target.value = "";
};

loadSettings();
Audio_.setVolume(CFG.volume);
Art.setFx(motionOK());
buildSetup();

</script>
