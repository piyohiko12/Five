}

/* ---------- 入力イベント ---------- */
async function toggleFullscreen() {
  Audio_.sfx.ui();
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if (document.fullscreenEnabled === false) {
      /* 埋め込み表示（GAS のウェブアプリなど）では全画面が許されていないので、先に案内だけ出す */
      throw new Error("Fullscreen is not allowed here");
    } else if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    } else {
      throw new Error("Fullscreen API is unavailable");
    }
  } catch (_) {
    alert("この表示環境では全画面APIが制限されています。WindowsはF11キー、MacはControl＋Command＋Fをお使いください。");
  }
}

window.addEventListener("keydown", e => {
  if ($("quitConfirm").classList.contains("on")) {
    if (e.code === "Escape") { e.preventDefault(); cancelQuit(); }
    return;
  }
  if (G.paused) {
    if (e.code === "Escape" || e.code === "Space") { e.preventDefault(); resumeGame(); }
    return;
  }
  if ($("edit").classList.contains("on")) return;
  if ($("ov").classList.contains("on")) return;
  if (!$("play").classList.contains("on")) return;
  if (e.code === "Escape") { e.preventDefault(); pauseGame(); return; }
  if (e.code === "Backspace") { e.preventDefault(); backspace(); return; }
  if (e.code === "Delete") { e.preventDefault(); clearAnswer(); return; }
  if (e.code === "Enter" || e.code === "NumpadEnter") {
    e.preventDefault();
    if (CFG.input === 1 && IN.romaji) {
      const [k, rest] = romajiConsume(IN.romaji, true);
      IN.romaji = rest;
      for (const ch of k) if (IN.kana.length < 15) IN.kana.push(G.kata ? toKata(ch) : ch);
      renderSlots();
    }
    fire(); return;
  }
  if (isMath()) {
    if (G.state === "answer" && !G.judging && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const k = e.key, low = k.toLowerCase();
      let tok = null;
      if (/^[0-9]$/.test(k)) tok = k;
      else if ("+-/^.".includes(k)) tok = k;
      else if ("xyab".includes(low)) tok = low;
      else if (low === "r") tok = "√";
      if (tok) { e.preventDefault(); pressMath(tok); }
      else if (e.code === "ArrowUp") { e.preventDefault(); mathMoveCursor("num"); }
      else if (e.code === "ArrowDown") { e.preventDefault(); mathMoveCursor("den"); }
      else if (e.code === "ArrowRight") { e.preventDefault(); mathMoveCursor(null); }
    }
    return;
  }
  if (answersInEnglish()) {
    if (CFG.input === 1 && G.state === "answer" && !G.judging && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const ch = e.key.toLowerCase();
      if (/^[a-z]$/.test(ch)) { e.preventDefault(); pressEnglish(ch); }
    }
    return;
  }
  if (CFG.input === 1 && G.state === "answer" && !G.judging && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const ch = e.key.toLowerCase();
    if (/^[a-z]$/.test(ch)) { e.preventDefault(); pressRomaji(ch); }
    else if (ch === "-") { e.preventDefault(); pressRomaji("-"); }
  }
});

/* ---------- 問題編集 ---------- */
let editSrc = JSON.parse(JSON.stringify(KANJI_RAW));
$("editBtn").onclick = () => { $("editArea").value = JSON.stringify(editSrc, null, 1); $("edit").classList.add("on"); };
$("editClose").onclick = () => $("edit").classList.remove("on");
$("editReset").onclick = () => { $("editArea").value = JSON.stringify(KANJI_RAW, null, 1); $("editMsg").textContent = "増量済みの初期問題を読み込みました。「この内容で使う」を押してください。"; };
$("editApply").onclick = () => {
  try {
    const o = JSON.parse($("editArea").value);
    for (const k of ["l1", "l2", "l3", "final", "b1", "b2"]) {
      if (!Array.isArray(o[k]) || !o[k].length) throw new Error(k + " が空です");
      const need = k === "b1" ? 3 : 2;
      for (const row of o[k]) if (!Array.isArray(row) || row.length < need) throw new Error(k + " の書式が違います");
    }
    QSET = normalizeQ(o); editSrc = o; PICK_BAGS.clear();
    $("editMsg").textContent = "反映しました。";
    Audio_.sfx.swap();
  } catch (err) { $("editMsg").textContent = "読み込めません：" + err.message; }
};
$("editDl").onclick = () => {
  const blob = new Blob([$("editArea").value], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "five-readers-questions.json"; a.click();
  URL.revokeObjectURL(a.href);
};
$("editUp").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("editArea").value = await f.text();
  $("editMsg").textContent = "読み込みました。「この内容で使う」を押してください。";
  e.target.value = "";
};

loadSettings();
Audio_.setVolume(CFG.volume);
Art.setFx(motionOK());
Art.setQuality(CFG.gfx);
buildSetup();

</script>
