<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173a63">
<title>FIVE READERS ― 漢字読破の航路</title>
<style>
/* ============================================================
   FIVE READERS — 漢字読破の航路
   配色・書体・図形はすべてこのファイル内で生成しています。
   外部画像・外部音源・外部フォントは一切使用しません。
   ============================================================ */
:root{
  --sumi:#173a63;        /* 明るい紺碧 */
  --kon:#245684;         /* 青 */
  --gunjo:#4b8fd0;       /* 空色 */
  --shironeri:#f8fbff;   /* 白 */
  --haiiro:#c5d8eb;      /* 淡青灰 */
  --kin:#ffd166;         /* 明るい金 */
  --shu:#ff6b5f;         /* 珊瑚色 */
  --midori:#55e6bd;      /* 明るい碧 */
  --stage-accent:#ffd166;
  --stage-fog:#b9852e;
  --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","MS PMincho",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  --latin:"Avenir Next","Futura","Segoe UI",var(--gothic);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;min-height:100dvh}
body{
  background:var(--sumi);color:var(--shironeri);font-family:var(--gothic);
  overflow:hidden;overscroll-behavior:none;
}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;filter:brightness(1.32) saturate(1.12)}
#vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.08) 15%,transparent 52%,rgba(12,42,76,.25) 100%);
}
#flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;background:#fff}
#flash.fire{animation:fl .5s ease-out}
#flash.hit{animation:flg .45s ease-out}
#flash.beam{animation:flr .7s ease-out}
#flash.kill{animation:flk .6s ease-out}
@keyframes flk{
  0%{opacity:.92;background:#fff}
  30%{opacity:.42;background:var(--stage-accent)}
  100%{opacity:0;background:var(--stage-accent)}
}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
@keyframes flg{0%{opacity:.55;background:var(--midori)}100%{opacity:0;background:var(--midori)}}
@keyframes flr{0%{opacity:.75;background:var(--shu)}60%{opacity:.25;background:var(--shu)}100%{opacity:0;background:var(--shu)}}

.wrap{position:relative;z-index:5;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px}
.screen{display:none;width:100%;max-width:1080px}
.screen.on{display:block}

#fullscreenBtn{
  position:fixed;z-index:70;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
  border:1px solid rgba(255,255,255,.48);background:rgba(30,78,124,.82);color:var(--shironeri);
  padding:8px 11px;font-size:11px;letter-spacing:.12em;backdrop-filter:blur(8px);
}
#fullscreenBtn:hover,#fullscreenBtn:focus-visible{border-color:var(--kin);color:var(--kin);outline:none}
#fullscreenBtn .exit{display:none}
:fullscreen #fullscreenBtn .enter{display:none}
:fullscreen #fullscreenBtn .exit{display:inline}

/* ---------- 共通パーツ ---------- */
.eyebrow{
  font-family:var(--latin);font-size:11px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--haiiro);font-weight:600;
}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(240,236,225,.28),transparent);margin:14px 0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{
  border:1px solid rgba(255,255,255,.38);background:rgba(37,87,137,.72);
  padding:12px 24px;letter-spacing:.16em;font-size:14px;transition:.16s;
  backdrop-filter:blur(6px);
}
.btn:hover,.btn:focus-visible{border-color:var(--kin);color:var(--kin);outline:none}
.btn.primary{
  border-color:var(--kin);color:#1a1408;background:var(--kin);font-weight:700;
}
.btn.primary:hover,.btn.primary:focus-visible{background:#ffe08a;color:#1a2940}
.btn:disabled{opacity:.32;cursor:default}

/* ---------- 設定画面 ---------- */
/* 項目が増えても画面に収まるよう、設定画面だけは縦にスクロールできる */
#setup{max-width:940px;max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
.title{text-align:center;margin-bottom:26px}
.title h1{
  font-family:var(--latin);font-size:clamp(30px,6vw,58px);font-weight:200;
  letter-spacing:.28em;text-indent:.28em;line-height:1;
}
.title .jp{
  font-family:var(--mincho);font-size:clamp(13px,2.2vw,17px);letter-spacing:.7em;
  text-indent:.7em;color:var(--kin);margin-top:14px;
}
.panel{
  border:1px solid rgba(255,255,255,.34);background:rgba(27,72,116,.72);
  box-shadow:0 18px 60px rgba(5,31,58,.24),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(12px);padding:22px 24px;
}
.stages{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px}
.stage-chip{
  border:1px solid rgba(240,236,225,.18);padding:12px 4px 10px;text-align:center;
  transition:.16s;position:relative;overflow:hidden;
}
.stage-chip .n{font-family:var(--latin);font-size:20px;font-weight:300;letter-spacing:.1em}
.stage-chip .nm{font-family:var(--mincho);font-size:11px;color:var(--haiiro);margin-top:5px;letter-spacing:.1em}
.stage-chip .df{font-family:var(--mincho);font-size:9px;color:var(--stage-accent);margin-top:4px;letter-spacing:.08em;white-space:nowrap}
.stage-chip:hover{border-color:rgba(240,236,225,.5)}
.stage-chip.sel{border-color:var(--kin);background:rgba(224,179,74,.12)}
.stage-chip.sel .n{color:var(--kin)}
.stage-chip.sel .nm{color:var(--shironeri)}
.stage-chip.sel .df{color:var(--kin)}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 22px;margin-top:14px}
.opt>span{font-size:11px;letter-spacing:.24em;color:var(--haiiro);display:block;margin-bottom:7px}
.seg{display:flex;border:1px solid rgba(240,236,225,.18)}
.seg button{
  flex:1;padding:9px 2px;font-size:13px;letter-spacing:.08em;color:var(--haiiro);transition:.14s;
  border-right:1px solid rgba(240,236,225,.12);
}
.seg button:last-child{border-right:none}
.seg button.sel{background:var(--kin);color:#1a1408;font-weight:700}
.seg button:hover:not(.sel){color:var(--shironeri)}

/* 数学の出題範囲・難易度 */
.mathopts{margin-top:18px;padding-top:16px;border-top:1px solid rgba(240,236,225,.16)}
.mathopts[hidden]{display:none}
.mrange-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.mrange-head>span{font-size:11px;letter-spacing:.24em;color:var(--haiiro)}
.mrange-quick{display:flex;gap:6px;flex-wrap:wrap}
.mrange-quick button{border:1px solid rgba(240,236,225,.28);padding:5px 10px;font-size:11px;letter-spacing:.1em;color:var(--haiiro);transition:.14s}
.mrange-quick button:hover,.mrange-quick button:focus-visible{border-color:var(--kin);color:var(--kin);outline:none}
.mrange-ch{font-family:var(--mincho);font-size:12px;letter-spacing:.14em;color:var(--kin);margin:12px 0 6px}
.mrange{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.unit-chip{position:relative;border:1px solid rgba(240,236,225,.2);padding:9px 6px 7px;text-align:center;color:var(--haiiro);transition:.14s}
.unit-chip .nm{display:block;font-family:var(--mincho);font-size:13px;letter-spacing:.06em;white-space:nowrap}
.unit-chip .ct{display:block;font-family:var(--latin);font-size:10px;letter-spacing:.12em;margin-top:3px;opacity:.7}
.unit-chip:hover,.unit-chip:focus-visible{border-color:rgba(240,236,225,.5);color:var(--shironeri);outline:none}
.unit-chip.sel{border-color:var(--kin);background:rgba(255,209,102,.16);color:var(--shironeri)}
.unit-chip.sel .ct{color:var(--kin);opacity:1}
.unit-chip.sel::before{content:"✓";position:absolute;top:3px;left:6px;font-size:10px;color:var(--kin)}
.mdiff{margin-top:16px}
.mdiff .seg button:first-child{flex:1.6}
.mrange-note{margin-top:8px;font-size:11px;letter-spacing:.08em;color:var(--haiiro)}

/* 出発ボタンの帯：設定画面をスクロールしても常に画面の下に見える */
.setup-foot{
  position:sticky;bottom:0;z-index:3;display:flex;gap:10px 14px;justify-content:space-between;align-items:center;flex-wrap:wrap;
  margin:22px -24px -22px;padding:12px 24px 14px;
  background:rgba(22,60,99,.94);border-top:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.setup-summary{flex:1 1 170px;min-width:0}
#setupSummary{font-size:12px;letter-spacing:.06em;color:var(--shironeri);line-height:1.6}
.saved-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px;font-size:11px;color:var(--haiiro);letter-spacing:.06em}
#resetBtn{font-size:11px;color:var(--haiiro);border-bottom:1px dotted rgba(255,255,255,.5);padding:1px 0;letter-spacing:.06em}
#resetBtn:hover,#resetBtn:focus-visible{color:var(--kin);border-color:var(--kin);outline:none}
.hintline{font-size:12px;color:var(--haiiro);letter-spacing:.06em;margin-top:9px;line-height:1.6}

/* ---------- 出撃 ---------- */
#launch{text-align:center}
#launch .cd{
  font-family:var(--latin);font-size:clamp(90px,22vw,190px);font-weight:100;line-height:1;
  letter-spacing:.05em;color:var(--kin);text-shadow:0 0 60px rgba(224,179,74,.5);
}
#launch .cd.go{font-size:clamp(40px,10vw,84px);letter-spacing:.34em;text-indent:.34em;color:var(--shironeri)}
.pulse{animation:pl .82s cubic-bezier(.2,.7,.3,1)}
@keyframes pl{0%{transform:scale(1.5);opacity:0}30%{opacity:1}100%{transform:scale(.86);opacity:0}}

/* ---------- ゲーム画面 ---------- */
#play{max-width:1080px;height:100%;display:none;flex-direction:column;justify-content:space-between;padding:6px 0;overflow:hidden}
#play.on{display:flex}
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hud .stg{font-family:var(--mincho);letter-spacing:.34em;font-size:13px;color:var(--stage-accent)}
.hud .lv{font-family:var(--latin);font-size:10px;letter-spacing:.34em;color:var(--haiiro);margin-top:4px}
.game-actions{display:flex;gap:6px;margin-top:8px}
.game-actions button{
  border:1px solid rgba(255,255,255,.34);background:rgba(26,69,112,.76);
  padding:6px 9px;font-size:10px;letter-spacing:.08em;color:var(--shironeri);white-space:nowrap;
}
.game-actions button:hover,.game-actions button:focus-visible{border-color:var(--kin);color:var(--kin);outline:none}
#quitBtn{border-color:rgba(255,107,95,.58);color:#ffd1cc}
.pips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:46%}
.pip{width:15px;height:15px;border:1px solid rgba(240,236,225,.3);position:relative;transform:rotate(45deg)}
.pip.done{background:var(--stage-accent);border-color:var(--stage-accent);box-shadow:0 0 10px var(--stage-accent)}
.pip.final{border-color:var(--kin);width:19px;height:19px}
.pip.bonus::after{
  content:"";position:absolute;inset:3px;background:var(--midori);
}
.crew{display:flex;gap:6px;align-items:center}
.crew i{
  width:11px;height:24px;display:block;background:var(--midori);
  clip-path:polygon(50% 0,100% 28%,100% 100%,0 100%,0 28%);
  transition:.3s;box-shadow:0 0 10px rgba(63,214,176,.45);
}
.crew i.lost{background:#2c333d;box-shadow:none;transform:translateY(4px) rotate(12deg);opacity:.5}
.crew i.now{background:var(--kin);box-shadow:0 0 14px var(--kin)}

/* 封印円（シグネチャ） */
.stagearea{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;container-type:size}
.seal{--seal:min(46vh,300px);position:relative;width:var(--seal);aspect-ratio:1;display:grid;place-items:center;transition:transform .35s}
.seal svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seal .ring-bg{fill:none;stroke:rgba(240,236,225,.13);stroke-width:2}
.seal .ring-fg{
  fill:none;stroke:var(--stage-accent);stroke-width:3;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%;
  filter:drop-shadow(0 0 6px var(--stage-accent));
}
.seal .glyphring{fill:none;stroke:rgba(240,236,225,.1);stroke-width:1;stroke-dasharray:2 9}
.seal.warn .ring-fg{stroke:var(--shu);filter:drop-shadow(0 0 12px var(--shu))}
.seal.warn{animation:sh .28s infinite}
@keyframes sh{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
.seal .core{
  position:relative;z-index:2;text-align:center;padding:0 10px;max-width:80%;
}
.seal .kanji{
  font-family:var(--mincho);font-weight:600;line-height:1.12;
  font-size:clamp(28px,8.5vh,64px);letter-spacing:.06em;
  text-shadow:0 0 3px rgba(4,17,33,.95),0 0 9px rgba(4,17,33,.8),0 0 26px rgba(0,0,0,.9),0 2px 0 rgba(0,0,0,.5);
}
.seal .kanji.small{font-size:clamp(17px,4.4vh,30px);letter-spacing:.02em;line-height:1.5}
.seal .lead{font-size:12px;letter-spacing:.24em;color:#e3eefa;margin-bottom:10px;text-shadow:0 0 3px rgba(4,17,33,.95),0 0 8px rgba(4,17,33,.85)}
.seal .qsub{font-size:12px;letter-spacing:.12em;color:#d6e5f5;margin-top:12px;min-height:1em;text-shadow:0 0 3px rgba(4,17,33,.95),0 0 8px rgba(4,17,33,.85)}
/* 問題の後ろだけを暗いガラスのように沈め、背景の絵や光を少しぼかす（白くは塗らない）。
   縁はぼかして消すので、封印円の見た目はそのまま */
.seal::before{
  content:"";position:absolute;inset:9%;z-index:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(6,22,42,.62) 0,rgba(6,22,42,.54) 62%,rgba(6,22,42,.26) 84%,rgba(6,22,42,0) 100%);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  -webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);
}
.seal.correct{animation:pop .5s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
/* 撃破：封印円が砕け散る */
.shock{
  position:absolute;inset:0;border-radius:50%;
  border:3px solid var(--stage-accent);opacity:0;pointer-events:none;z-index:1;
}
.shock.on{animation:shockA .75s cubic-bezier(.1,.7,.2,1)}
@keyframes shockA{
  0%{transform:scale(.5);opacity:1;border-width:10px;box-shadow:0 0 60px var(--stage-accent)}
  100%{transform:scale(2.3);opacity:0;border-width:1px}
}
/* 弾かれた瞬間に走る防壁の輪 */
.guard{
  position:absolute;inset:-5%;border-radius:50%;
  border:2px solid #cfd6e0;opacity:0;pointer-events:none;z-index:1;
}
.guard.on{animation:guardA .52s cubic-bezier(.15,.85,.25,1)}
@keyframes guardA{
  0%{transform:scale(1.16);opacity:0;border-width:1px}
  11%{transform:scale(1);opacity:1;border-width:8px;
      box-shadow:0 0 44px rgba(207,214,224,.9),inset 0 0 44px rgba(207,214,224,.5)}
  100%{transform:scale(1.03);opacity:0;border-width:1px}
}
.seal.burst svg{animation:sealBreak .85s cubic-bezier(.2,.75,.2,1) forwards}
@keyframes sealBreak{
  0%{transform:scale(1) rotate(0);opacity:1}
  14%{transform:scale(1.08) rotate(-3deg);opacity:1}
  100%{transform:scale(1.75) rotate(16deg);opacity:0}
}
.seal.burst .ring-fg{stroke:#fff;stroke-width:5;filter:drop-shadow(0 0 26px #fff)}
.seal.burst .glyphring{stroke:#fff;stroke-dasharray:1 5}
.seal.burst .lead{opacity:0;transition:opacity .18s}
.shake{animation:scShake .5s cubic-bezier(.3,.1,.3,1)}
.shake-s{animation:scShakeS .26s cubic-bezier(.3,.1,.3,1)}
@keyframes scShakeS{
  0%,100%{transform:translate(0,0)}
  22%{transform:translate(-4px,2px)}
  50%{transform:translate(3px,-2px)}
  78%{transform:translate(-2px,1px)}
}
@keyframes scShake{
  0%,100%{transform:translate(0,0)}
  12%{transform:translate(-9px,5px)}
  28%{transform:translate(8px,-6px)}
  44%{transform:translate(-6px,-3px)}
  62%{transform:translate(5px,4px)}
  80%{transform:translate(-3px,-2px)}
}
.seal.reject{animation:rj .34s}
@keyframes rj{
  0%,100%{transform:translate(0,0)}
  16%{transform:translate(-9px,-8px)}
  34%{transform:translate(8px,5px)}
  52%{transform:translate(-6px,-3px)}
  70%{transform:translate(4px,2px)}
  86%{transform:translate(-2px,-1px)}
}

.bonustag{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  font-family:var(--latin);font-size:11px;letter-spacing:.34em;text-indent:.34em;font-weight:700;
  color:#08120f;background:var(--midori);padding:5px 12px;white-space:nowrap;
  box-shadow:0 0 22px rgba(63,214,176,.7);animation:bt 1.1s ease-in-out infinite;
}
@keyframes bt{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}

.hintbox{
  position:absolute;right:0;top:6px;text-align:right;font-size:12px;color:var(--kin);
  letter-spacing:.14em;border-right:2px solid var(--kin);padding-right:9px;line-height:1.7;
}
.hintbox b{font-family:var(--mincho);font-size:19px;display:block}

.reveal{
  position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  font-family:var(--mincho);font-size:clamp(19px,4.2vh,30px);letter-spacing:.22em;text-indent:.22em;
  color:var(--kin);white-space:nowrap;text-shadow:0 0 18px rgba(0,0,0,.9);
  opacity:0;transition:opacity .3s;
}
.reveal.on{opacity:1;animation:revIn .55s cubic-bezier(.2,.9,.3,1)}
@keyframes revIn{
  0%{transform:translateX(-50%) translateY(16px) scale(.82);opacity:0;letter-spacing:.6em}
  100%{transform:translateX(-50%) translateY(0) scale(1);opacity:1;letter-spacing:.22em}
}
/* 正解時：吹き飛んだ漢字の跡に読みが浮かぶ */
.reveal.mid{bottom:auto;top:50%;transform:translate(-50%,-50%);z-index:3}
.reveal.mid.on{animation:revMid .6s cubic-bezier(.2,.9,.3,1)}
@keyframes revMid{
  0%{transform:translate(-50%,-50%) scale(1.5);opacity:0;filter:blur(6px);letter-spacing:.8em}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1;filter:blur(0);letter-spacing:.22em}
}

/* ---------- 入力欄 ---------- */
.slots{display:flex;gap:5px;justify-content:center;min-height:44px;align-items:center;margin:6px 0 2px}
.slot{
  --dx:0px;--spin:0deg;
  width:34px;height:42px;border:1px solid rgba(240,236,225,.22);display:grid;place-items:center;
  font-family:var(--mincho);font-size:22px;background:rgba(34,82,129,.78);
  animation:si .16s cubic-bezier(.2,.9,.3,1);
}
@keyframes si{from{transform:translateY(9px);opacity:0}to{transform:none;opacity:1}}
.slot.ghost{border-style:dashed;border-color:rgba(240,236,225,.13);background:none}
/* 発射（transform の関数列は全キーフレームで揃える） */
.slots.fly .slot{animation:sf .3s cubic-bezier(.35,.05,.5,1) forwards}
@keyframes sf{
  from{transform:translate(0,0) scale(1,1) rotate(0deg);opacity:1}
  to{transform:translate(0,-150px) scale(.55,.55) rotate(0deg);opacity:1}
}
/* 正解：爆発に飲まれて消える */
.slots.gone .slot{animation:sg .3s ease-out forwards}
@keyframes sg{
  from{transform:translate(0,-150px) scale(.55,.55) rotate(0deg);opacity:1}
  to{transform:translate(0,-168px) scale(.15,.15) rotate(0deg);opacity:0}
}
/* 不正解：封印に当たってつぶれ、回転しながら落ちる */
.slots.rej .slot{animation:sr .6s cubic-bezier(.2,.75,.3,1) forwards}
@keyframes sr{
  0%{transform:translate(0,-150px) scale(.55,.55) rotate(0deg);opacity:1;filter:brightness(1)}
  9%{transform:translate(0,-141px) scale(.80,.40) rotate(0deg);opacity:1;filter:brightness(4)}
  20%{transform:translate(0,-120px) scale(.60,.60) rotate(calc(var(--spin) * .12));opacity:1;filter:brightness(1)}
  100%{transform:translate(var(--dx),84px) scale(.40,.40) rotate(var(--spin));opacity:0;filter:brightness(1)}
}

/* ---------- キーボード ---------- */
.kbd{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:0 auto;max-width:640px}
.kbd button{
  border:1px solid rgba(255,255,255,.3);background:rgba(42,96,148,.82);
  font-family:var(--mincho);font-size:clamp(14px,2.6vh,19px);padding:8px 0;transition:.1s;
}
.kbd button:hover{background:rgba(74,143,208,.92);border-color:rgba(255,255,255,.65)}
.kbd button:active{transform:scale(.93)}
.kbd button.void{visibility:hidden}
.kbd button.mod{color:var(--kin);border-color:rgba(224,179,74,.4)}
.alpha-kbd{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:0 auto;max-width:640px}
.alpha-kbd button{
  border:1px solid rgba(255,255,255,.3);background:rgba(42,96,148,.82);color:var(--shironeri);
  font-family:var(--latin);font-size:clamp(13px,2.5vh,18px);font-weight:700;padding:9px 0;transition:.1s;
}
.alpha-kbd button:hover{background:rgba(74,143,208,.92);border-color:rgba(255,255,255,.65)}
.alpha-kbd button:active{transform:scale(.93)}
.slots.english{gap:3px}
.slots.english .slot{width:30px;font-family:var(--latin);font-weight:700;text-transform:uppercase}
.seal .kanji.english-prompt{
  font-family:var(--latin);font-weight:700;letter-spacing:.07em;line-height:1.15;
  font-size:clamp(22px,5.2vh,40px);white-space:nowrap;
}
.romaji-note{
  text-align:center;font-size:12px;color:var(--haiiro);letter-spacing:.16em;padding:16px 0 4px;
}
.romaji-note b{color:var(--shironeri);font-family:var(--mincho);letter-spacing:.3em}

/* ---------- 数学モード ---------- */
.seal .kanji.math{
  font-family:"Georgia","Cambria",var(--mincho);font-weight:500;
  font-size:clamp(23px,5.4vh,42px);letter-spacing:.01em;line-height:1.2;
  white-space:nowrap;
}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.02;margin:0 .12em}
.fr>span{padding:0 .28em}
.fr>span:first-child{border-bottom:1.6px solid currentColor}
.root-expr{display:inline-flex;align-items:flex-start;vertical-align:middle;white-space:nowrap;line-height:1;margin:0 .05em}
.root-symbol{display:inline-block;font-size:1.24em;line-height:.86;transform:translateY(.12em);margin-right:-.05em}
.root-radicand{display:inline-block;min-width:.62em;border-top:1.6px solid currentColor;padding:.08em .12em 0 .09em;line-height:1;text-align:center}
.power{display:inline-block;font-size:.6em;line-height:1;font-weight:600;vertical-align:baseline;position:relative;top:-.58em;margin-left:.04em}
.eqpre{font-family:"Georgia","Cambria",var(--mincho);font-size:22px;color:#dbe8f6;text-shadow:0 0 3px rgba(4,17,33,.9),0 0 8px rgba(4,17,33,.7);padding:0 3px 0 1px;align-self:center;letter-spacing:.02em;white-space:nowrap}
.equnit{font-family:"Georgia","Cambria",var(--mincho);font-size:19px;color:#dbe8f6;text-shadow:0 0 3px rgba(4,17,33,.9),0 0 8px rgba(4,17,33,.7);padding-left:4px;align-self:center;white-space:nowrap}
.ans-pre{margin-right:.08em}
.ans-unit{font-size:.72em;margin-left:.3em;letter-spacing:.04em}
/* 文章題（単位の換算・オームの法則など） */
.seal .kanji.math.wordq{
  font-family:var(--mincho);white-space:pre;font-size:clamp(16px,3.5vh,25px);
  line-height:1.45;letter-spacing:.04em;
}
/* 図（直角三角形・回路）。大きさは問題文の文字サイズに連動する */
.seal .kanji.math.figq{line-height:1;white-space:normal}
.mfig{position:relative;display:block;margin:0 auto;font-size:.4em;font-weight:500}
.mfig svg{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 1.5px rgba(4,17,33,.95))}
.seal .mfig svg{position:relative;inset:auto}   /* 封印円の輪（.seal svg）用の絶対配置を打ち消す */
.mfig.tri{width:10.5em;height:6.6em;margin-bottom:1.35em}
.mfig.tri svg path{stroke-width:1.2;opacity:.8}
.mfig .lb{position:absolute;transform:translate(-50%,-50%);font-size:1.35em;line-height:1;white-space:nowrap;font-family:"Georgia","Cambria",var(--mincho)}
.mfig .lb-b{transform:translate(0,-50%)}
.mfig .lb-c{transform:translate(-78%,-50%)}
.mfig .lb.ask{color:var(--stage-accent);font-style:italic;font-weight:700}
.mfig .lb.th{font-size:1.05em;color:var(--haiiro)}
.mfig.ckt{width:min(var(--ckt-w),14em)}
.mfig.ckt svg{height:auto;stroke-width:1.3}
.mfig.ckt text{fill:currentColor;stroke:none;font-size:11px;text-anchor:middle;font-family:"Georgia","Cambria",var(--mincho)}
.mfig.ckt circle{fill:currentColor;stroke:none}
.hintbox.math{max-width:min(44%,230px);white-space:pre-line;letter-spacing:.06em;line-height:1.6}
/* 分数の回答タイル：入力中の側を光らせ、カーソルを点滅させる。タップでその側へ移れる */
.inputarea{position:relative}
.slot.frac-slot{padding:2px 6px;font-size:19px}
.slot.frac-slot .fr{line-height:1}
.slot.frac-slot .fr>span{padding:1px .3em;min-width:1.1em;cursor:pointer;border-radius:2px}
.slot.frac-slot.editing{border-color:rgba(255,209,102,.75)}
.fpart.on{background:rgba(255,209,102,.24);box-shadow:inset 0 0 0 1px var(--kin)}
.fpart.on::after{content:"";display:inline-block;width:1.5px;height:.8em;margin-left:1px;vertical-align:-.05em;background:var(--kin);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.fracguide{
  position:absolute;left:0;right:0;bottom:100%;margin-bottom:2px;text-align:center;pointer-events:none;
  font-size:11px;letter-spacing:.08em;color:var(--kin);text-shadow:0 0 3px rgba(4,17,33,.95),0 0 8px rgba(4,17,33,.8);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.fracguide[hidden]{display:none}
.keyonly-inline{display:none}
@media (hover:hover) and (pointer:fine){.keyonly-inline{display:inline}}

/* ---------- 問題の大きさ ----------
   封印円は、HUD と回答欄のあいだに使える高さ・幅いっぱいまで広げる（300〜460px。以前は 300px 固定）。
   問題の文字は封印円に比例させるので、どの画面でも同じ割合で大きく見える。
   コンテナクエリ単位（cqh/cqw）が使えない古いブラウザでは、上の固定サイズのまま。 */
@supports (width:1cqh){
  .seal{--seal:clamp(300px,min(100cqh + 40px,94cqw),460px)}
  /* 2行になる4字熟語でも回答欄に重ならないよう、使える高さでも上限を決める */
  .seal .kanji{font-size:min(calc(var(--seal) * .24),calc(46cqh + 10px))}
  .seal .kanji.small{font-size:calc(var(--seal) * .112)}
  .seal .kanji.english-prompt{font-size:calc(var(--seal) * .15)}
  .seal .kanji.math{font-size:calc(var(--seal) * .16)}
  .seal .kanji.math.wordq{font-size:calc(var(--seal) * .095)}
  .seal .lead{font-size:max(12px,calc(var(--seal) * .045))}
  .seal .qsub{font-size:max(12px,calc(var(--seal) * .042))}
  .seal .reveal{font-size:calc(var(--seal) * .11)}
}
.mathpad{display:flex;gap:9px;justify-content:center;max-width:560px;margin:0 auto;flex-wrap:wrap}
.mkeys{display:grid;gap:5px}
.mkeys.num{grid-template-columns:repeat(3,minmax(52px,1fr))}
.mkeys.sym{grid-template-columns:repeat(2,minmax(52px,1fr));align-content:start}
.mkeys button{
  border:1px solid rgba(255,255,255,.3);background:rgba(42,96,148,.82);
  font-family:"Georgia","Cambria",var(--mincho);font-size:clamp(15px,2.7vh,20px);
  padding:11px 0;transition:.1s;color:var(--shironeri);
}
.mkeys button:hover{background:rgba(74,143,208,.92);border-color:rgba(255,255,255,.65)}
.mkeys button:active{transform:scale(.93)}
.mkeys button.op{color:var(--kin);border-color:rgba(224,179,74,.32)}
.mkeys button.icon{line-height:1;padding:9px 0}
.mkeys button.icon .fr{font-size:.8em}
.mkeys button.icon sup{font-size:.64em;vertical-align:.5em}
.ph{
  display:inline-block;width:.5em;height:.62em;border:1px dashed currentColor;
  opacity:.5;border-radius:1px;
}
/* 数学の回答欄：問題文と同じ数式書体・分数線・上付き位置を使う */
.slot.math{
  font-family:"Georgia","Cambria",var(--mincho);font-weight:500;
  font-size:22px;line-height:1.2;display:flex;align-items:center;justify-content:center;
}
.slot.math .math-inline{display:flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap}
.answer-root{display:inline-block;white-space:nowrap;line-height:1}
.answer-power{display:inline-block;white-space:nowrap;line-height:1;margin-left:.04em}
.slot.math.wide{width:auto;min-width:42px;height:50px;padding:2px 7px}
.slot.math.root{width:auto;min-width:40px;padding:0 5px}
.slot.math.power-unit{width:auto;min-width:42px;padding:0 5px}
.slot.math .ph{opacity:.45}

.ctrls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}
.ctrls .btn{padding:11px 20px;font-size:13px}
.ctrls .btn:disabled{opacity:.32}
kbd.kk{
  display:none;margin-left:7px;padding:2px 4px 1px;border:1px solid currentColor;border-radius:3px;
  font-family:var(--latin);font-size:9px;font-weight:600;line-height:1;letter-spacing:0;text-indent:0;opacity:.62;vertical-align:1px;
}
.keyonly{display:none}
@media (hover:hover) and (pointer:fine){kbd.kk{display:inline-block}.keyonly{display:block}}
.mkeys button{position:relative}
.mkeys kbd.kk{position:absolute;top:3px;right:3px;margin:0;font-size:8px;padding:1px 3px}
.fire{border-color:var(--stage-accent);color:var(--stage-accent);font-weight:700;letter-spacing:.3em;text-indent:.3em}
.fire:not(:disabled):hover{background:var(--stage-accent);color:#0a0d13}
.swap{border-color:var(--midori);color:var(--midori)}
.swap:hover{background:var(--midori);color:#08120f}
.swap b{font-family:var(--latin)}

/* ---------- タイマー ---------- */
.timer{display:flex;align-items:center;gap:12px;margin-top:9px}
.timer .bar{flex:1;height:3px;background:rgba(240,236,225,.12);position:relative;overflow:hidden}
.timer .bar i{
  position:absolute;inset:0;transform-origin:left;background:var(--stage-accent);
  box-shadow:0 0 12px var(--stage-accent);
}
.timer.warn .bar i{background:var(--shu);box-shadow:0 0 14px var(--shu)}
.timer .num{font-family:var(--latin);font-size:15px;letter-spacing:.16em;color:var(--haiiro);min-width:60px;text-align:right}
.timer.warn .num{color:var(--shu);font-weight:700}

/* 大きな警告数字 */
.bigcount{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;
  font-family:var(--latin);font-size:clamp(120px,32vh,280px);font-weight:100;color:var(--shu);
  opacity:0;
}
.bigcount.on{animation:bc .95s ease-out}

/* 爆発した問題文の破片 */
#boom{position:fixed;inset:0;z-index:62;pointer-events:none}
.shard{
  position:fixed;display:flex;align-items:center;justify-content:center;
  text-align:center;white-space:pre-wrap;will-change:transform,opacity,filter;
  text-shadow:0 0 18px rgba(255,255,255,.5);
}
@keyframes bc{0%{opacity:.85;transform:scale(1.35)}100%{opacity:0;transform:scale(.7)}}

/* ---------- オーバーレイ ---------- */
#ov{
  position:fixed;inset:0;z-index:70;display:none;place-items:center;text-align:center;
  background:rgba(12,43,75,.72);backdrop-filter:blur(7px);padding:20px;
}
#ov.on{display:grid}
#ov .in{animation:oi .4s cubic-bezier(.2,.8,.3,1)}
@keyframes oi{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
#ov h2{
  font-family:var(--latin);font-weight:200;letter-spacing:.3em;text-indent:.3em;
  font-size:clamp(26px,6.5vw,58px);line-height:1.15;
}
#ov .sub{font-family:var(--mincho);letter-spacing:.5em;text-indent:.5em;margin-top:14px;color:var(--kin);font-size:15px}
#ov p{margin-top:18px;color:var(--haiiro);font-size:14px;letter-spacing:.1em;line-height:1.9}
#ov .big{font-family:var(--mincho);font-size:clamp(24px,6vh,44px);color:var(--shironeri);letter-spacing:.2em;margin-top:8px}
#ov .acts{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#ov.good h2{color:var(--midori);text-shadow:0 0 50px rgba(63,214,176,.4)}
#ov.bad h2{color:var(--shu);text-shadow:0 0 50px rgba(226,80,63,.4)}
#ov.gold h2{color:var(--kin);text-shadow:0 0 50px rgba(224,179,74,.4)}
.crewlarge{display:flex;gap:10px;justify-content:center;margin-top:20px}
.crewlarge i{width:16px;height:36px;background:var(--midori);clip-path:polygon(50% 0,100% 28%,100% 100%,0 100%,0 28%)}
.crewlarge i.lost{background:#2c333d;opacity:.45}
.crewlarge i.now{background:var(--kin);animation:bt 1s infinite}

/* ---------- 問題編集 ---------- */
#edit{position:fixed;inset:0;z-index:80;display:none;background:rgba(13,46,80,.94);padding:20px;overflow:auto}
#edit.on{display:block}
#edit .box{max-width:820px;margin:0 auto}
#edit textarea{
  width:100%;height:52vh;margin-top:14px;background:#153f69;color:var(--shironeri);
  border:1px solid rgba(240,236,225,.2);padding:14px;font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;
  resize:vertical;
}
#edit .msg{font-size:12px;color:var(--kin);letter-spacing:.1em;min-height:18px;margin-top:8px}

#pauseScreen{
  position:fixed;inset:0;z-index:95;display:none;place-items:center;text-align:center;
  background:rgba(10,36,65,.82);backdrop-filter:blur(12px);padding:20px;
}
#pauseScreen.on{display:grid}
#pauseScreen .pause-card{
  min-width:min(420px,92vw);border:1px solid rgba(255,255,255,.38);
  background:rgba(31,78,123,.92);padding:34px 28px;box-shadow:0 24px 80px rgba(0,0,0,.28);
}
#pauseScreen h2{font-family:var(--latin);font-size:clamp(30px,7vw,58px);font-weight:300;letter-spacing:.28em;text-indent:.28em;color:var(--kin)}
#pauseScreen p{margin-top:12px;color:var(--haiiro);letter-spacing:.12em}
#pauseScreen .acts{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.volume-gauge{margin-top:14px;padding:12px 14px;border:1px solid rgba(255,255,255,.2);background:rgba(16,55,92,.46)}
.volume-gauge .volume-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.volume-gauge label{font-size:11px;letter-spacing:.18em;color:var(--haiiro)}
.volume-gauge output{font-family:var(--latin);font-size:13px;color:var(--kin);min-width:44px;text-align:right}
.volume-gauge input[type="range"]{
  --volume-pct:75%;appearance:none;-webkit-appearance:none;width:100%;height:8px;border-radius:999px;outline:none;
  background:linear-gradient(90deg,var(--kin) 0 var(--volume-pct),rgba(255,255,255,.16) var(--volume-pct) 100%);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.28);
}
.volume-gauge input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:21px;height:21px;border-radius:50%;border:2px solid #fff;background:var(--kin);
  box-shadow:0 0 0 4px rgba(255,209,102,.2),0 3px 10px rgba(0,0,0,.3);cursor:pointer;
}
.volume-gauge input[type="range"]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:var(--kin);
  box-shadow:0 0 0 4px rgba(255,209,102,.2),0 3px 10px rgba(0,0,0,.3);cursor:pointer;
}
#quitConfirm{
  position:fixed;inset:0;z-index:105;display:none;place-items:center;text-align:center;
  background:rgba(5,25,48,.88);backdrop-filter:blur(14px);padding:20px;
}
#quitConfirm.on{display:grid}
#quitConfirm .confirm-card{width:min(430px,92vw);border:1px solid rgba(255,255,255,.38);background:rgba(31,78,123,.97);padding:30px 26px;box-shadow:0 24px 80px rgba(0,0,0,.34)}
#quitConfirm h2{font-family:var(--mincho);font-size:clamp(23px,5vw,34px);color:var(--shu);letter-spacing:.12em}
#quitConfirm p{margin-top:14px;color:var(--haiiro);line-height:1.7}
#quitConfirm .acts{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}

@media (max-width:640px){
  /* スマホ：全画面ボタンは記号だけにして、残り人数の表示と重ならないようにする */
  .fs-label{display:none}
  .hud{padding-right:40px}
  #setupSummary{font-size:11px;letter-spacing:.03em}
  .ctrls{gap:6px}
  .ctrls .btn{padding:10px 11px;font-size:12px;letter-spacing:.06em}
  .ctrls .fire{letter-spacing:.2em;text-indent:.2em}
  .stages{grid-template-columns:repeat(4,1fr)}
  .kbd{gap:3px}
  .kbd button{padding:7px 0}
  .alpha-kbd{gap:3px}
  .alpha-kbd button{padding:8px 0}
  .slot{width:27px;height:34px;font-size:18px}
  .slots.english .slot{width:21px;font-size:16px}
  .slot.math{font-size:18px}
  .slot.math.wide{min-width:36px;height:42px;padding:1px 5px}
  .slot.frac-slot{font-size:16px}
  .fracguide{font-size:10px;letter-spacing:.02em}
  .slot.math.root{min-width:34px;padding:0 4px}
  .slot.math.power-unit{min-width:36px;padding:0 4px}
  .hud .stg{font-size:11px;letter-spacing:.2em}
  .mathpad{gap:6px}
  .mkeys{gap:4px}
  .mkeys.num{grid-template-columns:repeat(3,minmax(44px,1fr))}
  .mkeys.sym{grid-template-columns:repeat(2,minmax(44px,1fr))}
  .mkeys button{padding:10px 0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<button id="fullscreenBtn" type="button" aria-label="全画面表示を切り替える"><span class="enter">⛶<span class="fs-label"> 全画面</span></span><span class="exit">×<span class="fs-label"> 全画面終了</span></span></button>
<div class="bigcount" id="bigcount"></div>
<div id="boom" aria-hidden="true"></div>
<div id="pauseScreen" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
  <div class="pause-card">
    <h2 id="pauseTitle">PAUSED</h2>
    <p>ゲームを一時停止しています</p>
    <p class="keyonly">Esc か Space でも再開できます</p>
    <div class="volume-gauge">
      <div class="volume-row"><label for="pauseVolumeSlider">音量</label><output id="pauseVolumeValue">75%</output></div>
      <input id="pauseVolumeSlider" type="range" min="0" max="100" step="5" value="75" aria-label="一時停止中の音量">
    </div>
    <div class="acts">
      <button class="btn primary" id="resumeBtn">ゲームを再開</button>
      <button class="btn" id="pauseQuitBtn">ゲームを中止</button>
    </div>
  </div>
</div>
<div id="quitConfirm" role="dialog" aria-modal="true" aria-labelledby="quitConfirmTitle">
  <div class="confirm-card">
    <h2 id="quitConfirmTitle">ゲームを中止しますか？</h2>
    <p>現在の進行状況は失われ、設定画面へ戻ります。</p>
    <div class="acts">
      <button class="btn" id="cancelQuitBtn">ゲームに戻る</button>
      <button class="btn primary" id="confirmQuitBtn">中止する</button>
    </div>
  </div>
</div>

<div class="wrap">

<!-- ══════════ 設定 ══════════ -->
<section id="setup" class="screen on">
  <div class="title">
    <h1>FIVE READERS</h1>
    <div class="jp">漢字読破の航路</div>
  </div>

  <div class="panel">
    <div class="eyebrow">航路を選ぶ</div>
    <div class="stages" id="stages"></div>
    <div class="hintline" id="hintLine"></div>

    <div class="rule"></div>

    <div class="opts" id="opts"></div>

    <div class="mathopts" id="mathOpts" hidden></div>

    <div class="setup-foot">
      <div class="setup-summary">
        <div id="setupSummary"></div>
        <div class="saved-note"><span id="savedNote"></span><button type="button" id="resetBtn">初期設定に戻す</button></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="editBtn">問題を編集</button>
        <button class="btn primary" id="goBtn">出　発</button>
      </div>
    </div>
  </div>
</section>

<!-- ══════════ 出撃 ══════════ -->
<section id="launch" class="screen">

/* ローマ字バッファを可能な限りかなに変換する */
function romajiConsume(buf, final) {
  let out = "", s = buf;
  let guard = 0;
  while (s.length && guard++ < 40) {
    if (s.length >= 2 && s[0] === s[1] && /[bcdfghjkmpqrstvwxyz]/.test(s[0])) { out += "っ"; s = s.slice(1); continue; }
    if (s[0] === "n" && s.length >= 2 && s[1] !== "n" && !"aiueoy".includes(s[1])) { out += "ん"; s = s.slice(1); continue; }
    let hit = null;
    for (let L = Math.min(4, s.length); L >= 1; L--) {
      const k = s.slice(0, L);
      if (Object.prototype.hasOwnProperty.call(ROMAJI, k)) { hit = k; break; }
    }
    if (hit) { out += ROMAJI[hit]; s = s.slice(hit.length); continue; }
    if (ROMAJI_PREFIX.has(s)) break;
    s = s.slice(1);
  }
  if (final && s === "n") { out += "ん"; s = ""; }
  return [out, s];
}

/* ========== 6. 数学モード ==========
   出典：『工業高校生のための基礎数学』
     第1章 数学の基礎（整数の四則／文字式／指数／平方根／式の変形／一次方程式／三平方の定理／三角比）

   単元（＝出題範囲）ごとに、l1 基礎 / l2 標準 / l3 発展 / final 最難関 の4段階で持つ。
   各問は { disp, a, cat } を基本とし、必要に応じて次を足す。
     disp … 画面に出す式（下記の軽量マークアップ）
       ^(...)     指数         例 2^(3), x^(-7)
       sqrt(...)  平方根       例 sqrt(45)
       frac(a,b)  分数         例 frac(y,5)
       × ÷ ( ) -  はそのまま
     txt  … 文章題（disp の代わりに出す。改行は \n）
     fig  … 図（{ tri } 直角三角形 / { ckt } 抵抗の回路）
     a    … 答え（半角。指数は ^、平方根は √、分数は /、小数は . を使う）
     cat  … 判定方法 int / frac / poly / root / eqn / val
       eqn は「y＝◯」の右辺だけを答える（y＝ は画面が出す）
       val は値で判定する（小数・分数・√ の混じった数。3/5 と 0.6 はどちらも正解）
     lead … 問いかけ（省略時は cat から決める）
     pre  … 回答欄の前に出す文字（例 "x="）
     unit … 回答欄の後ろに出す単位（例 "m/s"）
     note … 補足（例 "sin36.9°＝0.6 とする"）
     hint … ヒント（省略時は cat から決める）
*/

/* ---- 単元（出題範囲） ---- */

/* ---- 問題を組み立てる小道具 ---- */
function mathCatOf(a) {
  if (/[a-z]/.test(a)) return "poly";
  if (a.includes("√")) return "root";
  if (a.includes("/")) return "frac";
  if (a.includes(".")) return "val";
  return "int";
}
/* [式, 答え] の並びを問題にする。o で cat などを上書きする */
function mrows(list, o) { return list.map(([disp, a]) => ({ disp, a, cat: mathCatOf(a), ...o })); }
/* 計算で出した小数の誤差（0.30000000000000004 など）を丸めて文字列にする */
function mnum(x) { return String(Number(x.toPrecision(12))); }

/* 単位 → [基本単位に直す倍率, 量の種類] */
const MU = {
  "mm": [1e-3, "len"], "cm": [1e-2, "len"], "m": [1, "len"], "km": [1e3, "len"],

const MU_HINT = {
  len: "1 km＝1000 m\n1 m＝100 cm＝1000 mm",
  area: "1 m²＝10⁴ cm²\n1 m²＝10⁶ mm²",
  vol: "1 m³＝10⁶ cm³\n1 L＝1000 cm³＝1000 mL",

/* 「240 mA」「1.2kΩ」→ 基本単位での値 */
function mval(s) {
  const m = /^([\d.]+)\s*(\S+)$/.exec(s);
  return parseFloat(m[1]) * MU[m[2]][0];
}
/* 単位の換算：cv(1530, "mm", "m") → 1.53 */
function cvt(txt, base, to) {
  return { txt, a: mnum(base / MU[to][0]), cat: "val", lead: `〔${to}〕に 換算せよ`, unit: to, hint: MU_HINT[MU[to][1]] };
}
function cv(v, from, to) { return cvt(`${v} ${from}`, v * MU[from][0], to); }
/* 10ⁿ の指数を答える */
function pn(disp, n) { return { disp, a: String(n), cat: "int", lead: "□ に入る数を こたえよ", pre: "□=", hint: "10ᵐ×10ⁿ＝10ᵐ⁺ⁿ\n1/10ⁿ＝10⁻ⁿ" }; }
/* 文章題（答えは式で計算して入れる） */
function wq(txt, a, o) { return { txt, a: typeof a === "number" ? mnum(a) : a, cat: "val", ...o }; }

/* 直角三角形：a＝底辺、b＝高さ、c＝斜辺（θ は底辺と斜辺の間） */
const SIDE_NAME = { a: "底辺 a", b: "高さ b", c: "斜辺 c" };
const TRIG_FN = { sin: ["b", "c"], cos: ["a", "c"], tan: ["b", "a"] };
const TRIG_HINT = "sinθ＝b/c　cosθ＝a/c\ntanθ＝b/a";
/* 三平方：わからない辺を "" にする */
function py(a, b, c, ans) {
  const ask = !a ? "a" : !b ? "b" : "c";
  const s = { a, b, c }; s[ask] = ask;
  return { fig: { tri: { ...s, ask } }, a: ans, cat: "root", lead: `${SIDE_NAME[ask]} を もとめよ`, pre: ask + "=", hint: "a²＋b²＝c²" };
}
function pw(txt, ans) { return { txt, a: ans, cat: "root", lead: "長さを もとめよ", hint: "a²＋b²＝c²" }; }
/* 三角比の値 */
function tr(fn, a, b, c, ans) {
  return { fig: { tri: { a, b, c, th: "θ" } }, a: ans, cat: "val", lead: `${fn} θ を もとめよ`, pre: fn + "θ=", hint: TRIG_HINT };
}
/* 三角比で辺を求める。given（例 "sin36.9°=0.6"）があれば答えはそこから計算する */
function ts(ask, known, len, deg, given, ans) {
  const s = { a: "", b: "", c: "" }; s[known] = len; s[ask] = ask;
  if (given) {
    const [, fn, v] = /^(sin|cos|tan)[\d.]+°=([\d.]+)$/.exec(given);
    const [num, den] = TRIG_FN[fn], val = parseFloat(v), side = parseFloat(len);
    ans = mnum(ask === num ? val * side : side / val);
  }
  return {
    fig: { tri: { ...s, th: deg + "°", ask } }, a: ans, cat: "val",
    lead: `${SIDE_NAME[ask]} を もとめよ`, pre: ask + "=",
    note: given ? given.replace("=", "＝") + " とする" : "",
    hint: given ? TRIG_HINT : "30°・45°・60° の\n三角定規の辺の比"
  };
}

/* 抵抗の回路：["s", …] は直列、["p", …] は並列、文字列は抵抗1本（"4Ω" "1.2kΩ"） */
function ckR(n) {
  if (typeof n === "string") return mval(n);
  const rs = n.slice(1).map(ckR);
  return n[0] === "s" ? rs.reduce((x, y) => x + y, 0) : 1 / rs.reduce((x, y) => x + 1 / y, 0);
}
const CKT_HINT = "直列 R₁＋R₂\n並列 R₁R₂÷(R₁＋R₂)";
function ckt(tree, unit) {
  return { fig: { ckt: tree }, a: mnum(ckR(tree) / MU[unit][0]), cat: "val", lead: `合成抵抗〔${unit}〕を もとめよ`, pre: "R₀=", unit, hint: CKT_HINT };
}
function cktI(tree, volt) {
  return { fig: { ckt: tree }, a: mnum(mval(volt) / ckR(tree)), cat: "val", lead: "流れる電流〔A〕を もとめよ", pre: "I=", unit: "A", note: `電源の電圧 ${volt}`, hint: "合成抵抗 R₀ を出してから\nI＝V÷R₀" };
}

const OHM_HINT = { I: "I＝V÷R", V: "V＝R×I", R: "R＝V÷I" };
function ohm(ask, given, unit) {
  const b = {};
  for (const k in given) b[k] = mval(given[k]);

  return {
    txt: Object.keys(given).map(k => `${k}＝${given[k]}`).join("\n"),
    a: mnum(base / MU[unit][0]), cat: "val", lead: `${OHM_NAME[ask]}〔${unit}〕を もとめよ`,
    pre: ask + "=", unit, hint: OHM_HINT[ask]

}

/* ---- 表示用のトークン ---- */
const MATH_KEYS_NUM = ["7", "8", "9", "4", "5", "6", "1", "2", "3", "0", "-", "+"];
const MATH_KEYS_SYM = ["x", "y", "a", "b", "√", "^", "/", "."];

function catLead(cat) { return cat === "eqn" ? "y について 解け" : "答えを もとめよ"; }
function catHint(cat) {
  return {
    int: "答えは整数（＋・−の数）",
    frac: "答えは分数",
    poly: "答えは文字式",
    root: "√を使う形（◯√◯ など）",
    eqn: "◯x（＋◯）の形",
    val: "小数・分数・√ で答えてよい"
  }[cat] || "";
}
function mathLead(q) { return q.lead || catLead(q.cat); }
function mathHint(q) { return q.hint || catHint(q.cat); }
/* 回答欄の前に出す文字（y について解く問題は「y＝」） */
function mathPre(q) { return q.pre != null ? q.pre : (q.cat === "eqn" ? "y=" : ""); }
function mathUnitName(id) { const u = MATH_UNITS.find(x => x.id === id); return u ? u.name : ""; }

/* ---- 数式の描画（disp → HTML） ---- */
function rootMarkup(value) {
  return '<span class="root-expr"><span class="root-symbol">√</span><span class="root-radicand">' +
    value + '</span></span>';
}
function powerMarkup(value) { return '<sup class="power">' + value + '</sup>'; }
const SUPER_DIGITS = { "0":"⁰", "1":"¹", "2":"²", "3":"³", "4":"⁴", "5":"⁵", "6":"⁶", "7":"⁷", "8":"⁸", "9":"⁹", "+":"⁺", "-":"⁻" };
function toSuperDigits(value) {
  return String(value).split("").map(ch => SUPER_DIGITS[ch] || ch).join("");
}

function mathHTML(d) {
  let s = d;
  s = s.replace(/\^\(([^()]+)\)/g, (_, value) => powerMarkup(value));
  s = s.replace(/frac\(([^(),]*),([^(),]*)\)/g,
    '<span class="fr"><span>$1</span><span>$2</span></span>');
  s = s.replace(/sqrt\(([^()]*)\)/g, (_, value) => rootMarkup(value));
  return s;
}

/* ---- 図（直角三角形・抵抗の回路） ---- */
function figHTML(f) {
  return f.tri ? triHTML(f.tri) : f.ckt ? cktHTML(f.ckt) : "";
}
/* 直角三角形：左下に θ、右下に直角。辺の文字は a（底辺）・b（高さ）・c（斜辺） */
function triHTML(t) {
  const lb = (key, x, y) => {
    const v = t[key];
    if (!v) return "";
    const ask = t.ask === key || /^[abc]$/.test(v);
    return `<span class="lb lb-${key}${ask ? " ask" : ""}" style="left:${x}%;top:${y}%">${mathHTML(v)}</span>`;
  };
  const th = t.th ? `<path d="M34,86 A22,22 0 0 0 30.9,74.9"/>` : "";
  return `<span class="mfig tri"><svg viewBox="0 0 160 100" aria-hidden="true">
      <polygon points="12,86 138,86 138,12"/><path d="M129,86 V77 H138"/>${th}</svg>` +
    lb("a", 48, 98) + lb("b", 90, 49) + lb("c", 40, 35) +
    (t.th ? `<span class="lb th" style="left:${t.th === "θ" ? 30 : 38}%;top:${t.th === "θ" ? 79 : 78}%">${mathEsc(t.th)}</span>` : "") +

  const SCALE = [0, 3, 5, 7, 10];               // 短調ペンタトニック
  const SCALE_MAJ = [0, 2, 4, 7, 9];            // 長調ペンタトニック
  const PROFILES = {
    l1:    { bpm: 104, root: 55.00, scale: SCALE,     lead: .040, pad: .024, drive: "triangle" },
    l2:    { bpm: 116, root: 55.00, scale: SCALE,     lead: .045, pad: .026, drive: "sawtooth" },
    l3:    { bpm: 128, root: 51.91, scale: SCALE,     lead: .048, pad: .028, drive: "sawtooth" },
    final: { bpm: 144, root: 46.25, scale: SCALE,     lead: .052, pad: .030, drive: "square" },
    bonus: { bpm: 152, root: 65.41, scale: SCALE_MAJ, lead: .046, pad: .026, drive: "triangle" }
  };

  function note(i) { const p = prof; return p.root * Math.pow(2, (p.scale[i % p.scale.length] + 12 * Math.floor(i / p.scale.length)) / 12); }

  function bgmTone(freq, t, dur, type, gain, slideTo) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, gain), t + Math.min(.03, dur * .2));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(bgmG); o.start(t); o.stop(t + dur + .03);
  }
  function bgmNoise(t, dur, gain, freq, type) {
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(); src.buffer = b;
    const f = ctx.createBiquadFilter(); f.type = type || "highpass"; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(bgmG); src.start(t); src.stop(t + dur + .02);
  }

  function schedule() {
    const spb = 60 / prof.bpm / 4;   // 16分
    while (nextT < ctx.currentTime + 0.2) {
      const t = nextT, s = step % 16;
      // 重低音とキック：4拍を強く刻む
      if (s % 4 === 0) {
        bgmTone(note(s === 8 ? 2 : 0), t, spb * 3.5, "sine", .22);
        bgmTone(108, t, Math.min(.16, spb * 1.4), "sine", .20, 42);
      }
      // スネアとシンバル：緊張感のあるバックビート
      if (s === 4 || s === 12) {
        bgmNoise(t, .12, .065, 1900, "bandpass");
        bgmNoise(t, .05, .035, 6500, "highpass");
      }
      // パッドコード：低域から中域を厚くする
      if (s === 0 || s === 8) {
        const chord = s === 0 ? [0, 2, 4] : [1, 3, 5];
        chord.forEach((idx, i) => {
          bgmTone(note(idx) * 2, t + i * .008, spb * 7.6, i === 1 ? "sine" : "triangle", prof.pad);
        });
        bgmTone(note(s === 0 ? 0 : 2) * 2, t, spb * 2.8, "sawtooth", .018);
      }
      // 走るアルペジオ
      if (s % 2 === 0) {
        const idx = [0, 2, 4, 3, 5, 4, 2, 1][(s / 2) % 8];
        bgmTone(note(idx) * 4, t, spb * 1.65, prof.drive, prof.lead);
      }
      // ハイハット
      if (s % 2 === 1) {
        bgmNoise(t, .035, s === 15 ? .055 : .038, 7200, "highpass");
      }
      // 小節後半の高音アクセントでハラハラ感を強調
      if (s === 3 || s === 7 || s === 11 || s === 15) {
        const idx = [4, 3, 5, 4][(s - 3) / 4];
        bgmTone(note(idx) * 8, t, spb * .8, "sine", .020);
      }
      nextT += spb; step++;
    }
  }

  function bgmStart(name) {
    if (!bgmOn) return;
    resume();
    prof = PROFILES[name] || PROFILES.l1;
    if (timer) clearInterval(timer);
    step = 0; nextT = ctx.currentTime + 0.06;
    bgmG.gain.cancelScheduledValues(ctx.currentTime);
    bgmG.gain.setValueAtTime(0.0001, ctx.currentTime);
    bgmG.gain.exponentialRampToValueAtTime(BGM_LEVEL, ctx.currentTime + 0.6);
    timer = setInterval(schedule, 50);
  }
  function bgmStop(fade) {
    if (!ctx) return;
    if (timer) { clearInterval(timer); timer = null; }   // 先に停止（新BGMのタイマーを誤って消さないため）
    bgmG.gain.cancelScheduledValues(ctx.currentTime);
    bgmG.gain.setValueAtTime(Math.max(0.0002, bgmG.gain.value), ctx.currentTime);
    bgmG.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (fade || 0.05));
  }
  function bgmDuck(on) {
    if (!ctx || !timer) return;
    bgmG.gain.cancelScheduledValues(ctx.currentTime);
    bgmG.gain.exponentialRampToValueAtTime(on ? 0.12 : BGM_LEVEL, ctx.currentTime + 0.25);
  }
  function setBgmEnabled(v) { bgmOn = v; if (!v) bgmStop(0.3); }
  function setVolume(v) {
    masterVolume = Math.max(0, Math.min(1, Number(v)));
    if (!ctx || !master) return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.linearRampToValueAtTime(masterVolume, ctx.currentTime + .12);
  }

  return { resume, sfx, bgmStart, bgmStop, bgmDuck, setBgmEnabled, setVolume };
})();

/* ===== js3_art.js ===== */
/* ========== 4. 映像（すべてCanvasで生成／外部画像なし） ========== */
const Art = (() => {
  const cv = document.getElementById("bg");
  const c = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1, t = 0, raf = null;
  let fxOn = true;

  const st = {
    stage: 1, kind: "ruins", accent: "#ffd166", fog: "#b9852e", sky: ["#4b300b", "#9a6b27"],
    room: 0, level: "l1",
    show: 0,       // 守護者の出現度 0→1
    target: 0,
    hurt: 0,       // 被弾フラッシュ
    shake: 0,
    warp: 0,       // 発進演出
    grow: 0,       // 経過による膨張 0→1
    flare: 0,      // 撃破の閃光
    burstR: 60     // 撃破時の半径
  };
  const parts = [];   // 破片
  const waves = [];   // 衝撃波
  const smoke = [];   // 煙
  let rays = 0;       // 放射状の光条
  let bx = 0, by = 0; // 爆心

  const stars = [];
  for (let i = 0; i < 130; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.5 + .3, s: Math.random() * .6 + .2 });
  const motes = [];
  for (let i = 0; i < 60; i++) motes.push({ x: Math.random(), y: Math.random(), r: Math.random() * 2.2 + .6, v: Math.random() * .3 + .06, p: Math.random() * 6.28 });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function setStage(n, level, room) {
    const s = STAGES[n];
    st.stage = n; st.level = level || "l1";
    st.accent = s.accent; st.fog = s.fog; st.sky = s.sky;
    st.kind = (n === 5) ? MIRAGE_ORDER[st.level] : s.kind;
    if (room != null) st.room = room;
    document.documentElement.style.setProperty("--stage-accent", s.accent);
    document.documentElement.style.setProperty("--stage-fog", s.fog);
  }
  function setLevel(level) { st.level = level; if (st.stage === 5) st.kind = MIRAGE_ORDER[level]; }
  function appear() { st.target = 1; st.show = 0; }
  function vanish() { st.target = 0; }
  function hurt() { st.hurt = 1; if (fxOn) st.shake = 1; }

  function guardR() {
    const lv = lvIdx[st.level] || 0;
    return Math.min(W, H) * (0.16 + lv * 0.028) * (1 + st.grow * .10) * Math.max(st.show, .3);
  }
  /* 正解＝問題が爆発する（cx,cy を渡すと爆心を指定できる） */
  function burst(cx, cy, R) {
    cx = (cx == null) ? W / 2 : cx;
    cy = (cy == null) ? H * 0.40 : cy;
    R = R || guardR();
    st.burstR = R; bx = cx; by = cy;

    const N = fxOn ? 84 : 26;
    for (let i = 0; i < N; i++) {
      const a = Math.random() * 6.283;
      const sp = (0.8 + Math.random() * 4.0) * R * 0.034;
      const ember = Math.random();
      parts.push({
        x: cx + Math.cos(a) * R * .3 * Math.random(),
        y: cy + Math.sin(a) * R * .3 * Math.random(),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
        s: R * (0.02 + Math.random() * 0.07),
        rot: Math.random() * 6.283, vr: (Math.random() - .5) * .3,
        life: 1, dec: 0.010 + Math.random() * 0.014,
        col: ember < .30 ? "#ffffff" : (ember < .48 ? "#ffd48a" : st.accent)
      });
    }
    if (parts.length > 260) parts.splice(0, parts.length - 260);

    waves.push({ x: cx, y: cy, r: R * .30, v: R * .115, life: 1, w: 8 });
    waves.push({ x: cx, y: cy, r: R * .10, v: R * .060, life: 1, w: 3 });

    const M = fxOn ? 7 : 3;
    for (let i = 0; i < M; i++) {
      const a = Math.random() * 6.283, d = Math.random() * R * .4;
      smoke.push({
        x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d,
        vx: Math.cos(a) * R * .012, vy: -R * (.008 + Math.random() * .012),
        r: R * (.18 + Math.random() * .22), gr: R * .012, life: 1, dec: .010 + Math.random() * .006
      });

  }

  /* 不正解＝弾かれる。守護者は消さず、衝突点に火花だけを散らす */
  function spark(cx, cy, R) {
    bx = cx; by = cy; st.burstR = R;
    const pal = ["#ffffff", "#cfd6e0", "#9fb4c8"];
    const N = fxOn ? 36 : 12;
    for (let i = 0; i < N; i++) {
      const a = (Math.random() < .25) ? Math.random() * 6.283 : Math.random() * Math.PI; // 主に下方へ
      const sp = (1.2 + Math.random() * 3.2) * R * 0.05;
      parts.push({
        x: cx + (Math.random() - .5) * R * .55,
        y: cy + (Math.random() - .5) * R * .22,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .9 - .9,
        s: R * (0.018 + Math.random() * 0.042),
        rot: Math.random() * 6.283, vr: (Math.random() - .5) * .5,
        life: 1, dec: .030 + Math.random() * .030,
        col: pal[(Math.random() * 3) | 0]
      });
    }
    if (parts.length > 260) parts.splice(0, parts.length - 260);
    waves.push({ x: cx, y: cy, r: R * .08, v: R * .075, life: 1, w: 3, col: "#dfe6ef" });
    st.flare = Math.max(st.flare, .34);
    if (fxOn) st.shake = Math.max(st.shake, .7);
  }

  function fxLayer() {
    const cx = bx, cy = by, R = st.burstR;

    // 煙（先に、暗く）
    for (let i = smoke.length - 1; i >= 0; i--) {
      const m = smoke[i];
      c.save(); c.globalAlpha = Math.max(0, m.life) * .30;
      const g = c.createRadialGradient(m.x, m.y, 1, m.x, m.y, m.r);
      g.addColorStop(0, "rgba(24,20,16,.9)"); g.addColorStop(1, "rgba(24,20,16,0)");
      c.fillStyle = g; c.beginPath(); c.arc(m.x, m.y, m.r, 0, 6.283); c.fill();
      c.restore();
      m.x += m.vx; m.y += m.vy; m.r += m.gr; m.vy *= .985; m.life -= m.dec;
      if (m.life <= 0) smoke.splice(i, 1);
    }

    if (st.flare > .01) {
      const rr = R * 2.6 * (1.35 - st.flare * .35);
      const g = c.createRadialGradient(cx, cy, 1, cx, cy, rr);
      g.addColorStop(0, `rgba(255,255,255,${(st.flare * .95).toFixed(3)})`);
      g.addColorStop(.18, `rgba(255,226,168,${(st.flare * .70).toFixed(3)})`);
      g.addColorStop(.40, hexA(st.accent, st.flare * .45));
      g.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = g; c.beginPath(); c.arc(cx, cy, rr, 0, 6.283); c.fill();
    }
    if (rays > .01) {
      c.save(); c.globalAlpha = rays * .9; c.strokeStyle = "#fff"; c.lineCap = "round";
      for (let i = 0; i < 10; i++) {
        const a = i * .6283 + .21;
        c.lineWidth = Math.max(1, R * .022 * rays);
        const len = R * (1.3 + (i % 3) * .55) * (1.7 - rays);
        c.beginPath();
        c.moveTo(cx + Math.cos(a) * R * .18, cy + Math.sin(a) * R * .18);
        c.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
        c.stroke();
      }
      c.restore();
      rays -= .065;
    }
    for (let i = waves.length - 1; i >= 0; i--) {

      const wc = w.col || st.accent;
      c.strokeStyle = wc; c.lineWidth = Math.max(.5, w.w * w.life);
      c.shadowBlur = 18; c.shadowColor = wc;

      c.fillStyle = p.col; c.shadowBlur = 12; c.shadowColor = p.col;

  /* --- 背景 --- */
  function bg() {

    g.addColorStop(0, st.sky[0]); g.addColorStop(1, st.sky[1]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    // 中心のもや
    const cx = W / 2, cy = H * .42;
    const rg = c.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * .62);
    rg.addColorStop(0, hexA(st.fog, .55));
    rg.addColorStop(.5, hexA(st.fog, .12));
    rg.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = rg; c.fillRect(0, 0, W, H);

    if (st.stage === 7 || st.stage === 5) {
      c.save();
      for (const s of stars) {
        const a = .3 + .7 * Math.abs(Math.sin(t * s.s + s.x * 30));
        c.globalAlpha = a * .8;
        c.fillStyle = "#fff";
        c.beginPath(); c.arc(s.x * W, s.y * H * .8, s.r, 0, 6.283); c.fill();
      }
      c.restore();
    }

    // 遠景シルエット
    c.save();
    c.globalAlpha = .5;
    c.fillStyle = shade(st.sky[0], -14);

        const r0 = 40 + p * p * Math.max(W, H) * .8;
        const len = 20 + p * 120 * st.warp;

        c.beginPath();

    c.beginPath(); c.moveTo(0, H);

        c.lineTo(cx + i * s * 1.1 - s * .42, base);

        c.lineTo(cx + i * s * 1.1 + s * .18, base - s * .45);
        c.lineTo(cx + i * s * 1.1 + s * .18, base - s * .8);
        c.stroke();
      }
    }
    c.restore();
  }

  /* --- 守護者 --- */

const ROUTE_MIX = {

  1: "基礎100%", 2: "基礎75%・標準25%", 3: "基礎50%・標準50%",
  4: "基礎25%・標準50%・発展25%", 5: "標準50%・発展50%",

/* ---- 数学の入力（分数は分子・分母を別々に持つ） ----
   IN.kana には "3" "√" "x" などの文字と、分数 { num:[…], den:[…] } が並ぶ。
   IN.cur が null なら末尾に、{ i, part } なら i 番目の分数の分子（num）か分母（den）に書き足す。
   ・分数キー：直前に数（2√3 など）があればそれを分子にして分母へ。なければ空の分数を作って分子へ。
              分数の中で押すと分子⇄分母を切り替える。
   ・分数の分母を入力したあとに ＋・− を押すと、分数の外へ出る。 */
const isFrac = it => it && typeof it === "object";
function mathTokenCount() { return IN.kana.reduce((n, it) => n + (isFrac(it) ? it.num.length + it.den.length : 1), 0); }
function mathTarget() { return IN.cur ? IN.kana[IN.cur.i][IN.cur.part] : IN.kana; }
function pressMath(tok) {
  if (G.state !== "answer" || G.judging) return;
  Audio_.resume();
  if (tok === "/") { mathFractionKey(); Audio_.sfx.key(); renderSlots(); return; }
  if (mathTokenCount() >= 20) return;
  if (IN.cur && IN.cur.part === "den" && (tok === "+" || tok === "-") && mathTarget().length) IN.cur = null;
  mathTarget().push(tok);
  Audio_.sfx.key(); renderSlots();
}
function mathFractionKey() {
  if (IN.cur) { IN.cur = { i: IN.cur.i, part: IN.cur.part === "num" ? "den" : "num" }; return; }
  /* 直前の数（小数・√・係数つきの√）を分子にする。3 → 分数 → 5 の順でも打てるように */
  let k = IN.kana.length;
  const numAt = j => typeof IN.kana[j] === "string" && /^[\d.]$/.test(IN.kana[j]);
  while (k > 0 && numAt(k - 1)) k--;
  if (k > 0 && IN.kana[k - 1] === "√") { k--; while (k > 0 && numAt(k - 1)) k--; }
  const num = IN.kana.splice(k);
  IN.kana.push({ num, den: [] });
  IN.cur = { i: IN.kana.length - 1, part: num.length ? "den" : "num" };
}
/* 分子・分母へ移る（↑↓キー、分数の部分をタップ）。part が null なら分数の外へ */
function mathMoveCursor(part, index) {
  if (G.state !== "answer" || G.judging) return;
  let i = index;
  if (i == null) i = IN.cur ? IN.cur.i : (isFrac(IN.kana[IN.kana.length - 1]) ? IN.kana.length - 1 : -1);
  const next = part && i >= 0 && isFrac(IN.kana[i]) ? { i, part } : null;
  if (JSON.stringify(next) === JSON.stringify(IN.cur)) return;
  IN.cur = next;
  Audio_.sfx.key(); renderSlots();
}
function mathBackspace() {
  if (IN.cur) {
    const f = IN.kana[IN.cur.i], list = f[IN.cur.part];
    if (list.length) list.pop();
    else if (IN.cur.part === "den") IN.cur = { i: IN.cur.i, part: "num" };   // 空の分母で消す → 分子へ戻る
    else { IN.kana.splice(IN.cur.i, 1); IN.cur = null; }                     // 空の分子で消す → 分数ごと消す
    return true;
  }
  if (!IN.kana.length) return false;
  if (isFrac(IN.kana[IN.kana.length - 1])) IN.cur = { i: IN.kana.length - 1, part: "den" };   // 分数の中へ入って消していく
  else IN.kana.pop();
  return true;
}
/* 判定用の文字列。分子・分母が数や √数だけなら 3/5・√3/2 の形、それ以外は (…)/(…) */
function mathSerialize(items) {
  const simpleNum = t => /^-?(\d+(\.\d+)?)?(√\d+(\.\d+)?)?$/.test(t) && /\d/.test(t);
  const simpleDen = t => /^(\d+(\.\d+)?)?(√\d+(\.\d+)?)?$/.test(t) && /\d/.test(t);
  return items.map(it => {
    if (!isFrac(it)) return it;
    const n = it.num.join(""), d = it.den.join("");
    return simpleNum(n) && simpleDen(d) ? `${n}/${d}` : `(${n})/(${d})`;
  }).join("");
}
function pressEnglish(ch) {
  if (!answersInEnglish() || G.state !== "answer" || G.judging || !/^[a-z]$/i.test(ch)) return;
  Audio_.resume();
  if (IN.kana.length >= 20) return;
  IN.kana.push(ch.toLowerCase());
  Audio_.sfx.key(); renderSlots();
}
function disp(ch) { return G.kata ? toKata(ch) : ch; }

function pressKana(ch) {
  if (G.state !== "answer" || G.judging) return;
  Audio_.resume();
  if (ch === "゛" || ch === "゜") {
    if (!IN.kana.length) return;
    const last = IN.kana[IN.kana.length - 1];
    const h = toHira(last);
    const from = ch === "゛" ? DAKU_FROM : HAN_FROM;
    const to = ch === "゛" ? DAKU_TO : HAN_TO;
    const i = from.indexOf(h);
    if (i < 0) { Audio_.sfx.wrong(); return; }
    IN.kana[IN.kana.length - 1] = G.kata ? toKata(to[i]) : to[i];
    Audio_.sfx.key(); renderSlots(); return;
  }
  if (IN.kana.length >= 15) return;
  IN.kana.push(disp(ch));
  Audio_.sfx.key(); renderSlots();
}
function pressRomaji(ch) {
  IN.romaji += ch;
  const [kana, rest] = romajiConsume(IN.romaji, false);
  IN.romaji = rest;
  for (const k of kana) { if (IN.kana.length < 15) IN.kana.push(G.kata ? toKata(k) : k); }
  if (kana) Audio_.sfx.key();
  renderSlots();
}
function backspace() {
  if (G.state !== "answer" || G.judging) return;
  if (isMath()) { if (!mathBackspace()) return; }
  else if (IN.romaji) IN.romaji = IN.romaji.slice(0, -1);
  else if (IN.kana.length) IN.kana.pop();
  else return;
  Audio_.sfx.del(); renderSlots();
}
function clearInput() { IN.kana = []; IN.romaji = ""; IN.cur = null; renderSlots(); }
/* 「全部消す」ボタン・Delete キー */
function clearAnswer() {
  if (G.state !== "answer" || G.judging || (!IN.kana.length && !IN.romaji)) return;
  Audio_.sfx.del(); clearInput();
}

function renderSlots() {
  const s = $("slots");
  $("fracGuide").hidden = !(isMath() && IN.cur);
  s.className = "slots";
  s.innerHTML = "";
  if (isMath()) {
    const pre = G.q ? mathPre(G.q) : "";
    if (pre) {
      const p = document.createElement("div"); p.className = "eqpre"; p.textContent = pre; s.appendChild(p);
    }
    let run = [];
    const flush = () => {
      for (const u of mathUnits(run)) {
        const d = document.createElement("div");
        d.className = "slot math" + (u.k === "frac" ? " wide" : u.k === "root" ? " root" : "sup" in u ? " power-unit" : "");
        d.innerHTML = `<span class="math-inline">${unitHTML(u)}</span>`;
        s.appendChild(d);
      }
      run = [];
    };
    IN.kana.forEach((it, i) => {
      if (!isFrac(it)) { run.push(it); return; }
      flush();
      s.appendChild(fracSlot(it, i));
    });
    flush();
    if (!IN.kana.length) { const d = document.createElement("div"); d.className = "slot math ghost"; s.appendChild(d); }
    if (G.q && G.q.unit) {
      const u = document.createElement("div"); u.className = "equnit"; u.textContent = G.q.unit; s.appendChild(u);
    }
    $("fireBtn").disabled = !(mathTokenCount() && G.state === "answer" && !G.judging);
    paintCtrls();
    return;
  }
  if (answersInEnglish()) s.classList.add("english");
  for (const k of IN.kana) {
    const d = document.createElement("div"); d.className = "slot"; d.textContent = k; s.appendChild(d);
  }
  if (IN.romaji) {
    const d = document.createElement("div"); d.className = "slot ghost";
    d.style.fontFamily = "var(--latin)"; d.style.fontSize = "15px";
    d.textContent = IN.romaji; s.appendChild(d);
  }
  if (!IN.kana.length && !IN.romaji) {
    const d = document.createElement("div"); d.className = "slot ghost"; s.appendChild(d);
  }
  $("fireBtn").disabled = !(IN.kana.length && G.state === "answer" && !G.judging);
  paintCtrls();

const RING_C = 2 * Math.PI * 84;
function startTimer(total) {
  G.tTotal = total; G.tStart = performance.now(); G.timeUp = false; G.lastSec = 99; G.pauseElapsed = 0;
  $("ringFg").style.strokeDasharray = RING_C;
  cancelAnimationFrame(G.raf);
  if (G.paused) {
    G.timing = false; G.pauseWasTiming = true;
    $("ringFg").style.strokeDashoffset = 0;
    $("timerBar").style.transform = "scaleX(1)";
    $("timerNum").textContent = total.toFixed(1);
    return;
  }
  G.timing = true;
  tick();
}
function tick() {
  if (!G.timing) return;
  G.raf = requestAnimationFrame(tick);
  const el = (performance.now() - G.tStart) / 1000;
  const rem = Math.max(0, G.tTotal - el);
  const ratio = rem / G.tTotal;
  $("ringFg").style.strokeDashoffset = RING_C * (1 - ratio);
  $("timerBar").style.transform = `scaleX(${ratio})`;
  $("timerNum").textContent = rem.toFixed(1);
  $("seal").classList.toggle("warn", rem <= 6);
  $("timer").classList.toggle("warn", rem <= 6);
  Art.setGrow(Math.min(1, el / G.tTotal));
  const sec = Math.ceil(rem);
  if (sec <= 5 && sec >= 1 && sec !== G.lastSec) { G.lastSec = sec; bigCount(sec); Audio_.sfx.tick(); }
  if (rem <= 0) {
    if (G.judging) { G.timeUp = true; }
    else { G.timing = false; cancelAnimationFrame(G.raf); finish("timeout"); }
  }
}
function stopTimer() {
  G.timing = false; G.pauseWasTiming = false; G.pauseElapsed = 0;

  G.timing = false; cancelAnimationFrame(G.raf);

}

/* ---------- 出題 ----------
   同じ難易度の中では「シャッフルの袋（シャッフルバッグ）」方式で出題する。
   その難易度の問題を一度ランダムに並べ替え、全問を出し切るまで重複させない。
   袋はゲームをまたいで保持するので、続けて遊んでも同じ問題が固まって出にくい。 */
const PICK_BAGS = new Map();
function shuffledIndices(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function drawFromBag(key, len) {
  if (len <= 0) return 0;
  let bag = PICK_BAGS.get(key);
  if (!bag || bag.len !== len) { bag = { len, order: shuffledIndices(len), pos: 0 }; PICK_BAGS.set(key, bag); }
  if (bag.pos >= bag.order.length) {
    const last = bag.order[bag.order.length - 1];
    bag.order = shuffledIndices(len);
    if (len > 1 && bag.order[0] === last) {
      const j = 1 + Math.floor(Math.random() * (len - 1));
      [bag.order[0], bag.order[j]] = [bag.order[j], bag.order[0]];
    }
    bag.pos = 0;
  }
  return bag.order[bag.pos++];
}
function activeSetTag() {
  if (isMath()) return "M[" + mathUnitsSelected().join(",") + "]";
  if (isEnglish()) return answersInEnglish() ? "E" : "EJ";
  if (isRadical()) return "R";
  return "K";
}
function pick(poolName) {
  const full = activeSet()[poolName];
  let pool = full, keySuffix = "";
  if ((poolName === "b1" || poolName === "b2") && full.length > 8) {
    const windowSize = Math.max(8, Math.ceil(full.length * .5));
    const maxStart = Math.max(0, full.length - windowSize);
    const start = Math.round(((G.stage - 1) / 6) * maxStart);
    pool = full.slice(start, start + windowSize);
    keySuffix = "#" + start;
  }
  const i = drawFromBag(activeSetTag() + ":" + poolName + keySuffix, pool.length);
  return pool[i];
}

/* 正解＝問題そのものが爆発し、封印が砕ける */
function explodeQuestion() {
  const t = $("qText"), layer = $("boom");
  layer.innerHTML = "";
  const r = t.getBoundingClientRect();
  if (!r.width || !r.height) return null;

  const center = { x: r.left + r.width / 2, y: r.top + r.height / 2, R: Math.max(72, Math.max(r.width, r.height) * .95) };
  if (RMQ.matches) { t.style.visibility = "hidden"; $("qSub").style.visibility = "hidden"; return center; }

  const cs = getComputedStyle(t);
  const N = CFG.fx ? 12 : 5;

  // 中心から放射状に、角度をゆらした楔形へ切り分ける
  const angs = [];
  for (let i = 0; i <= N; i++) {
    const base = i / N * 360;
    angs.push(i === 0 || i === N ? base : base + (Math.random() - .5) * (360 / N) * .55);
  }
  for (let i = 0; i < N; i++) {
    const a0 = angs[i], a1 = angs[i + 1];
    const pts = ["50% 50%"];
    for (let k = 0; k <= 3; k++) {
      const a = (a0 + (a1 - a0) * k / 3) * Math.PI / 180;
      pts.push(`${(50 + 95 * Math.cos(a)).toFixed(1)}% ${(50 + 95 * Math.sin(a)).toFixed(1)}%`);
    }
    const el = document.createElement("div");
    el.className = "shard";
    if (isMath()) el.innerHTML = t.innerHTML; else el.textContent = t.textContent;
    el.style.left = r.left + "px"; el.style.top = r.top + "px";
    el.style.width = r.width + "px"; el.style.height = r.height + "px";
    el.style.fontFamily = cs.fontFamily; el.style.fontSize = cs.fontSize;
    el.style.fontWeight = cs.fontWeight; el.style.lineHeight = cs.lineHeight;
    el.style.letterSpacing = cs.letterSpacing; el.style.color = cs.color;
    el.style.clipPath = `polygon(${pts.join(",")})`;
    layer.appendChild(el);

    const mid = (a0 + a1) / 2 * Math.PI / 180;
    const dist = (70 + Math.random() * 170) * (CFG.fx ? 1 : .55);
    const dx = Math.cos(mid) * dist, dy = Math.sin(mid) * dist;
    const rot = (Math.random() - .5) * 170;
    el.animate([
      { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1, filter: "brightness(7)" },
      { transform: `translate(${dx * .3}px,${dy * .3 - 18}px) rotate(${rot * .25}deg) scale(1.08)`, opacity: 1, filter: "brightness(2)", offset: .16 },
      { transform: `translate(${dx}px,${dy + 110}px) rotate(${rot}deg) scale(.68)`, opacity: 0, filter: "brightness(1)" }
    ], { duration: 820 + Math.random() * 340, easing: "cubic-bezier(.15,.6,.35,1)", fill: "forwards" });
  }
  t.style.visibility = "hidden";
  $("qSub").style.visibility = "hidden";
  setTimeout(() => { layer.innerHTML = ""; }, 1500);
  return center;
}
